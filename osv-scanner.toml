# OSV-Scanner configuration (picked up from the repository root by osv-scan).
# Every entry needs a reason, an owner-visible expiry, and evidence that the
# vulnerable code is unreachable from gbrain. Remove an entry as soon as a
# fixed version exists or the dependency is gone.

[[IgnoredVulns]]
id = "GHSA-hp3w-g68c-fv3c"
ignoreUntil = 2027-01-06T00:00:00Z
reason = """
sprintf-js <= 1.1.3 (no patched version) throws RangeError on attacker-chosen
precision specifiers. It reaches bun.lock only as argparse@1.0.10's dependency,
and argparse@1 only through js-yaml@3's CLI (node_modules/js-yaml/bin/js-yaml.js).
gbrain uses js-yaml's library API, which never loads argparse or sprintf-js, and
nothing in src/ or scripts/ imports either package, so no gbrain format string
reaches sprintf-js. Real fix: move to js-yaml 4 (argparse 2, no sprintf-js),
tracked in TODOS.md.
"""
